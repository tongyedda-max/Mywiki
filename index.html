<script>
var SUPA_URL="https://xlplarozmcjcqgvfsyaj.supabase.co";
var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhscGxhcm96bWNqY3FndmZzeWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTk0MzAsImV4cCI6MjEwNDQzNTQzMH0.ObTyjGPjlZbCjrMVQzllCmFIKYaDRnVL-3CXXgY21mQ";
if(!SUPA_URL){document.getElementById("app").innerHTML='<h2 style="padding:40px">未設定 SUPA_URL / SUPA_KEY</h2>'}else{start()}

function start(){
var SDB=supabase.createClient(SUPA_URL,SUPA_KEY);
var ME=null,FAVS={},RECENT=[];

function el(id){return document.getElementById(id)}
function esc(s){s=String(s==null?"":s);return s.split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;")}
function toast(msg){var t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;z-index:9999";document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function timeAgo(iso){var s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return"剛剛";if(s<3600)return Math.floor(s/60)+"分鐘前";if(s<86400)return Math.floor(s/3600)+"小時前";return new Date(iso).toLocaleDateString("zh-HK")}
function journalTitle(){var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];var d=new Date();var day=d.getDate();var suf="th";if(day==1||(day>20&&day%10==1))suf="st";else if(day==2||(day>20&&day%10==2))suf="nd";else if(day==3||(day>20&&day%10==3))suf="rd";return M[d.getMonth()]+" "+day+suf+", "+d.getFullYear()}

window.addEventListener("hashchange",route);
SDB.auth.getSession().then(function(res){ME=res.data.session?res.data.session.user:null;route()});
SDB.auth.onAuthStateChange(function(ev,session){ME=session?session.user:null;route()});

function route(){
  if(!ME){viewAuth();return}
  var h=location.hash||"#/";
  var m=h.match(/^#\/page\/([0-9a-f-]{10,})/i);
  var me=h.match(/^#\/edit\/?([0-9a-f-]{10,})?$/i);
  if(m)viewPage(m[1]);
  else if(me)viewEditor(me[1]||null);
  else if(h.indexOf("#/search/")===0){viewHome();setTimeout(function(){if(el("q")){el("q").value=decodeURIComponent(h.split("/")[2]);el("q").dispatchEvent(new Event("input"))}},80)}
  else if(h==="#/graph")viewGraph();
  else if(h==="#/allpages")viewAllPages();
  else if(h==="#/console")viewConsole();
  else if(h==="#/help")viewHelp();
  else if(h==="#/tool/incubator")viewIncubator();
  else if(h==="#/tool/musgen")viewMusGen();
  else viewHome();
}

/* ---- 登入 ---- */
function viewAuth(){
  var html='<div style="min-height:100vh;display:grid;place-items:center;padding:20px">';
  html+='<div class="card" style="padding:22px;max-width:360px;width:100%">';
  html+='<h1 style="font-size:20px">📚 知識維基</h1>';
  html+='<p style="color:#999;font-size:13px;margin:4px 0 14px">使用 Email 登入</p>';
  html+='<input id="em" placeholder="Email" style="margin-bottom:8px">';
  html+='<input id="pw" type="password" placeholder="密碼（至少6位）">';
  html+='<p id="amsg" style="color:#c22;font-size:12px;margin:8px 0 0"></p>';
  html+='<button class="btn" style="width:100%;margin:10px 0" id="btnGo">進入</button>';
  html+='</div></div>';
  el("app").innerHTML=html;
  el("btnGo").onclick=submitAuth;
  el("pw").addEventListener("keydown",function(e){if(e.key==="Enter")submitAuth()});
}
async function submitAuth(){
  el("amsg").textContent="";
  var r=await SDB.auth.signInWithPassword({email:el("em").value.trim(),password:el("pw").value});
  if(r.error){el("amsg").textContent=r.error.message;return}
  ME=r.data.user;route();
}
async function logout(){await SDB.auth.signOut();ME=null;route()}

/* ---- 外殼 ---- */
function buildShell(){
  var html='<div id="wrap">';
  html+='<button id="burger">☰</button><div id="mask"></div>';
  html+='<aside id="sb"><div id="sbBody">';
  html+='<div id="logo">📚 知識維基</div>';
  html+='<button class="sbi" data-act="home">🔍 搜索</button>';
  html+='<button class="sbi" data-act="newpage">＋ 新增頁面</button>';
  html+='<hr>';
  html+='<button class="sbi" data-act="journal">🗓 今日日記 ⭐</button>';
  html+='<button class="sbi" data-act="graph">🌌 知識圖譜</button>';
  html+='<button class="sbi" data-act="allpages">📚 所有頁面</button><hr>';
  html+='<div class="sbLabel">⭐ 收藏</div><div id="sbFavs"></div><hr>';
  html+='<button class="sbi" data-act="toolbox" id="tbMain">🧰 工具箱 ▸</button>';
  html+='<div id="toolboxSub">';
  html+='<button class="sbi" data-act="incubator">💡 想法孵化器</button>';
  html+='<button class="sbi" data-act="musgen">🎵 音樂記錄生成器</button>';
  html+='</div>';
  html+='<button class="sbi" data-act="console">⚙️ 控制台</button>';
  html+='<button class="sbi" data-act="help">❓ 說明</button>';
  html+='</div><button id="logout">⎋ 登出</button></aside>';
  html+='<main id="main"></main></div>';
  el("app").innerHTML=html;
  el("burger").onclick=sidebarOpen;
  el("mask").onclick=sidebarClose;
  el("logout").onclick=logout;
  var btns=document.querySelectorAll(".sbi");
  for(var i=0;i<btns.length;i++)btns[i].onclick=onSideBtn;
  renderSbFavs();
}
function sidebarOpen(){el("sb").style.display="flex";el("mask").style.display="block"}
function sidebarClose(){if(!el("sb"))return;el("sb").style.display="none";el("mask").style.display="none"}
function onSideBtn(){
  var act=this.getAttribute("data-act");
  if(act==="toolbox"){el("toolboxSub").classList.toggle("open");this.textContent=el("toolboxSub").classList.contains("open")?"🧰 工具箱 ▾":"🧰 工具箱 ▸"}
  else if(act==="home"){location.hash="#/"}
  else if(act==="allpages")location.hash="#/allpages";
  else if(act==="newpage")location.hash="#/edit";
  else if(act==="journal")openJournal();
  else if(act==="graph")location.hash="#/graph";
  else if(act==="console")location.hash="#/console";
  else if(act==="help")location.hash="#/help";
  else if(act==="incubator")location.hash="#/tool/incubator";
  else if(act==="musgen")location.hash="#/tool/musgen";
}
async function renderSbFavs(){
  var box=el("sbFavs");if(!box)return;
  var r=await SDB.from("favorites").select("pages(id,title,icon)").order("created_at");
  var rows=[],data=r.data||[];
  for(var i=0;i<data.length;i++){if(data[i].pages)rows.push(data[i].pages)}
  if(rows.length===0){box.innerHTML='<div class="sbLabel" style="color:#c9c4bb">喺頁面撳☆收藏</div>';return}
  var html="";
  for(var j=0;j<rows.length;j++)html+='<button class="sbi" data-goto="'+rows[j].id+'">'+(rows[j].icon||"📄")+" "+esc(rows[j].title)+'</button>';
  box.innerHTML=html;
  var btns=box.querySelectorAll("button");
  for(var k=0;k<btns.length;k++)btns[k].onclick=function(){sidebarClose();location.hash="#/page/"+this.getAttribute("data-goto")};
}

/* ---- 通用：存入維基 ---- */
async function saveToWiki(title,markdown,source){
  if(!ME){toast("請先登入");return null}
  var r=await SDB.from("pages").select("id").eq("title",title).maybeSingle();
  var pageId;
  if(r.data){pageId=r.data.id;await SDB.from("blocks").delete().eq("page_id",pageId)}
  else{
    var ins=await SDB.from("pages").insert({user_id:ME.id,title:title,source:source||"tool"}).select("id").single();
    if(ins.error){toast("存入失敗："+ins.error.message);return null}
    pageId=ins.data.id;
  }
  var bi=await SDB.from("blocks").insert({page_id:pageId,content:markdown,order_num:0});
  if(bi.error){toast("內容失敗："+bi.error.message);return null}
  toast("已存入維基 ✓「"+title+"」");
  return pageId;
}

/* ---- 首頁 ---- */
var Q_T=null;
async function viewHome(){
  if(!el("wrap"))buildShell();sidebarClose();
  var html='<div class="pad" style="max-width:720px">';
  html+='<div class="searchrow"><input id="q" placeholder="搜尋…／輸入新頁名（支持 音樂/莫扎特）"><button class="btn" id="btnNew">＋ 新增</button></div>';
  html+='<div id="favBox" style="margin-bottom:16px"></div>';
  html+='<h2 class="sec">⏱ 最近修改</h2><div class="card" id="recentBox"><div class="empty">載入中…</div></div>';
  html+='<h2 class="sec" style="margin-top:18px">🌐 全庫搜尋</h2><div class="card" id="dbRes"><div class="empty">輸入關鍵字搜尋所有頁面…</div></div>';
  html+='</div>';
  el("main").innerHTML=html;
  el("btnNew").onclick=function(){location.hash="#/edit"};
  el("q").addEventListener("keydown",function(e){if(e.key==="Enter")quickCreate()});
  el("q").addEventListener("input",onQ);
  await loadHome();
}
async function loadHome(){
  var a=await SDB.from("pages").select("id,title,icon,source,is_journal,updated_at").order("updated_at",{ascending:false}).limit(50);
  RECENT=a.data||[];
  var b=await SDB.from("favorites").select("page_id");
  FAVS={};var fb=b.data||[];
  for(var i=0;i<fb.length;i++)FAVS[fb[i].page_id]=1;
  drawFavChips();drawRecent();
}
function drawFavChips(){
  var box=el("favBox");if(!box)return;
  var favs=[];for(var i=0;i<RECENT.length;i++)if(FAVS[RECENT[i].id])favs.push(RECENT[i]);
  if(favs.length===0){box.innerHTML="";return}
  var html='<h2 class="sec">⭐ 收藏</h2>';
  for(var j=0;j<favs.length;j++)html+='<a class="chip" href="#/page/'+favs[j].id+'">'+(favs[j].icon||"📄")+" "+esc(favs[j].title)+'</a>';
  box.innerHTML=html;
}
function recentHtml(list){
  var html="";
  for(var i=0;i<list.length;i++){var p=list[i];

async function quickCreate(){
  var path=el("q").value.trim();if(!path)return;
  var segs=path.split("/"),clean=[],parent=null,last=null;
  for(var i=0;i<segs.length;i++){var s=segs[i].trim();if(s)clean.push(s)}
  if(clean.length===0)return;
  for(var j=0;j<clean.length;j++){
    var q=SDB.from("pages").select("id").eq("title",clean[j]);
    if(parent)q=q.eq("parent_id",parent);else q=q.is("parent_id",null);
    var r=await q.maybeSingle();

      if(ins.error){toast("建頁失敗："+ins.error.message);return}

    }

  }

async function savePage(id){
  var isEdit=!!id;
  var title=el("epTitle").value.trim()||"無標題";
  var content=el("epContent").value.trim();
  var pageId=id;
  if(!isEdit){
    var ins=await SDB.from("pages").insert({user_id:ME.id,title:title}).select("id").single();
    if(ins.error){toast("儲存失敗："+ins.error.message);return}
    pageId=ins.data.id;
  }else{
    var up=await SDB.from("pages").update({title:title,updated_at:new Date().toISOString()}).eq("id",pageId);
    if(up.error){toast("更新失敗："+up.error.message);return}
  }
  await SDB.from("blocks").delete().eq("page_id",pageId);
  if(content){
    var bi=await SDB.from("blocks").insert({page_id:pageId,content:content,order_num:0});
    if(bi.error){toast("內容儲存失敗："+bi.error.message);return}
  }
  toast("已儲存 ✓");location.hash="#/page/"+pageId;
}

async function viewPage(id){

    var par=await SDB.from("pages").select("id,title,parent_id").eq("id",cur.parent_id).maybeSingle();

  var ch=await SDB.from("pages").select("id,title").eq("parent_id",id);

  html+='<div class="card" style="margin-top:14px;padding:16px">';
  var bd=bl.data||[];
  if(bd.length===0){html+='<div class="empty">空白頁面。<a href="#/edit/'+id+'" style="color:#8b5cf6">開始編輯</a></div>'}
  else{
    var mdText=bd.map(function(x){return x.content}).join("\n\n");
    var linked=mdText.replace(/\[\[(.*?)\]\]/g,function(m,t){return '<a href="#/search/'+encodeURIComponent(t)+'" class="md-link">[['+esc(t)+']]</a>'});
    html+='<div class="md-body">'+marked.parse(linked)+'</div>';
  }
  html+='</div>';
  html+='<div style="margin-top:10px;text-align:right">';
  html+='<button onclick="location.hash=\'#/edit/'+id+'\'" style="font-size:13px;color:#8b5cf6;padding:6px 10px;border:1px solid #e5e3de;border-radius:8px;background:#fff">✏️ 編輯</button></div>';
    var mk=p.title.indexOf("版本___")===0?"ver":p.title.indexOf("作品___")===0?"work":p.title.indexOf("音樂人___")===0?"mus":null;
  if(mk)html+='<button onclick="MG_editFromWiki(\''+id+'\',\''+mk+'\')" style="font-size:13px;color:#6d28d9;padding:6px 10px;border:1px solid #c4b5fd;border-radius:8px;background:#fff;margin-left:6px">🎵 喺生成器編輯呢張卡</button>';
  
  if(ch.data&&ch.data.length>0){
    html+='<h2 class="sec" style="margin-top:20px">子頁面</h2>';
    for(var c=0;c<ch.data.length;c++)html+='<a class="chip" href="#/page/'+ch.data[c].id+'">📄 '+esc(ch.data[c].title)+'</a>';
  }
  var bkRes=await SDB.from("blocks").select("content, page_id, pages(id,title)").ilike("content","%[["+p.title+"]]%");
  var backlinks=(bkRes.data||[]).filter(function(b){return b.page_id!==id});
  if(backlinks.length>0){
    html+='<h2 class="sec" style="margin-top:24px">🔗 反向連結 ('+backlinks.length+')</h2>';
    html+='<div class="card" style="padding:12px;background:#fcfcfc">';
    for(var k=0;k<backlinks.length;k++){
      var b=backlinks[k],src=b.pages;
      if(!src)continue;
      var ctx=b.content,idx=ctx.indexOf("[["+p.title+"]]");
      if(idx>0)ctx="…"+ctx.substring(Math.max(0,idx-50),idx+p.title.length+52)+"…";
      html+='<div class="backlink-item"><a href="#/page/'+src.id+'" style="font-weight:bold;color:#8b5cf6;text-decoration:none;display:block;margin-bottom:2px">'+esc(src.title)+'</a>';

    }
    html+='</div>';
  }
  html+='</div>';
  el("main").innerHTML=html;
  el("pfav").onclick=function(){toggleFav(id)};
}

var G_NET=null,G_NODES=[];
async function viewGraph(){
  if(!el("wrap"))buildShell();sidebarClose();
  el("main").innerHTML='<div class="pad"><div style="display:flex;gap:8px;margin-bottom:8px"><input id="gq" placeholder="聚焦：輸入頁名…"><span class="time" id="gcount" style="align-self:center"></span></div><div class="card" style="padding:8px"><div id="network-main"></div></div><div class="time" style="margin-top:6px">🔵 頁面 ・ 🟣 日記 ・ 🟠 想法　紫線=[[連結]]　灰線=父子　點節點開頁</div></div>';
  var pr=await SDB.from("pages").select("id,title,parent_id,source,is_journal").limit(500);
  var pages=pr.data||[];
  var br=await SDB.from("blocks").select("page_id,content").limit(2000);
  var nodes=[],edges=[],byId={},byTitle={};
  pages.forEach(function(p){
    byId[p.id]=p;byTitle[p.title]=p;
    nodes.push({id:p.id,label:(p.title||"").slice(0,18),color:p.is_journal?"#c4b5fd":(p.source==="incubator"?"#fdba74":"#bfdbfe"),shape:"dot",size:10,title:p.title});
  });
  pages.forEach(function(p){if(p.parent_id&&byId[p.parent_id])edges.push({from:p.parent_id,to:p.id,color:"#ddd"})});
  (br.data||[]).forEach(function(b){
    if(!b.content)return;
    var m=b.content.match(/\[\[([^\]]+)\]\]/g)||[];
    m.forEach(function(w){var t=w.slice(2,-2);var tg=byTitle[t];
      if(tg&&tg.id!==b.page_id)edges.push({from:b.page_id,to:tg.id,color:"#8b5cf6"})});
  });
  if(G_NET){try{G_NET.destroy()}catch(e){}G_NET=null}
  G_NODES=nodes;
  G_NET=new vis.Network(el("network-main"),{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},{interaction:{hover:true,dragView:true,zoomView:true,dragNodes:true},physics:{stabilization:true},nodes:{font:{size:12}},edges:{width:1}});
  el("gcount").textContent=nodes.length+" 節點 / "+edges.length+" 連結";
  G_NET.on("click",function(ps){if(ps.nodes.length)location.hash="#/page/"+ps.nodes[0]});
  el("gq").addEventListener("input",function(){
    var q=this.value.trim().toLowerCase();if(!q)return;
    var hit=G_NODES.find(function(n){return(n.title||"").toLowerCase().indexOf(q)>=0});
    if(hit)G_NET.focus(hit.id,{scale:1.2,animation:true});
  });

function incGenQ(){

  if(tags.length===1)for(i=0;i<10;i++)avail.push(i);

  else{for(i=25;i<30;i++)avail.push(i);for(i=10;i<15;i++)avail.push(i)}
  var usable=avail.filter(function(x){return INC_USED.indexOf(x)<0});
  if(usable.length===0){INC_USED=INC_USED.filter(function(x){return avail.indexOf(x)>=0});usable=avail}
  var ri=usable[Math.floor(Math.random()*usable.length)];
  INC_USED.push(ri);
  var q=INC_TPL[ri];
  for(var k=0;k<tags.length&&k<3;k++)q=q.split("`["+String.fromCharCode(65+k)+"]`").join("<b>"+esc(tags[k])+"</b>");

function incSearchNotes(text){

      if(!tagNodes[tag]){tagNodes[tag]="tag-"+tag;nodes.push({id:tagNodes[tag],label:tag,shape:"circle",color:"#ffd3b6"})}

function MG_parseVer(txt){
  var out={f:{},S:{},perf:[],notes:[],likes:[],dis:[],chg:[],exp:[],wera:[],mtype:[],mroles:[],minst:[],wsrc:[],msrc:[],movs:[{l:"I.",txt:""}]};
  var map={"平台":"platform","時長":"dur","演出日期":"date","樂團/場地":"venue","Label":"label","速度印象":"f_tempo","音色取向":"f_timbre","風格取向":"f_style","樂章":"movs","一句話總評":"verdict"};
  var lines=txt.split("\n"),sec="";
  lines.forEach(function(raw){
    if(raw.indexOf("逐段筆記")>=0){sec="notes";return}
    if(raw.indexOf("⑤ 總結")>=0){sec="sum";return}
    var t=raw.trim();
    if(!t)return;
    if(sec==="notes"){
      var m=t.match(/^(?:(\d+:\d{1,2})\s+)?(.*)$/);
      if(m&&(m[1]||m[2]))out.notes.push({t:m[1]||"",txt:(m[2]||"").replace(/\s*\[跳轉\]\(.*?\)/,"")});
      return;
    }
    if(sec==="sum"){
      if(t.indexOf("待補：")===0){out.f.todo=t.slice(3);return}
      var em=t.match(/^(✅|⛔|✍️|🧪)\s*(.*)$/);
      if(em){
        (em[1]==="✅"?out.likes:em[1]==="⛔"?out.dis:em[1]==="✍️"?out.chg:out.exp).push({x:em[2]});
      }
      return;
    }
    var pm=t.match(/^([^:：]+)::\s*(.*)$/);
    if(!pm)return;
    var k=pm[1].trim(),v=pm[2].trim();
    if(!v||k==="type"||k==="記錄日期")return;
    if(k==="狀態"){out.S.stSeg=v;return}
    if(k==="片源"){out.S.srcSeg=v;return}
    if(k==="性質"){out.S.natSeg=v;return}
    if(k==="評分"){out.S.rtSeg=v;return}
    if(k==="連結"){out.f.url=v;return}
    if(k==="作品"){out.f.workName=v.replace(/\[\[|\]\]/g,"").replace(/^作品___/,"");return}
    if(k==="作曲家"){out.f.composerCus=v.replace(/\[\[|\]\]/g,"");return}
    if(k==="演奏者"){v.replace(/\[\[音樂人___([^\]]+)\]\]/g,function(m2,n2){out.perf.push(n2);return""});return}
    if(k==="對比版本"){out.f.vcomp=v.replace(/\[\[|\]\]/g,"").replace(/^版本___/,"");return}
    if(map[k])out.f[map[k]]=v;
  });
  return out;
}

/* ⭐ 解析作品卡／音樂人卡（從維基回載用） */
function MG_parseWork(txt){
  var out={f:{},S:{},perf:[],notes:[],likes:[],dis:[],chg:[],exp:[],wera:[],mtype:[],mroles:[],minst:[],wsrc:[],msrc:[],movs:[]};
  var map={"暱稱":"w_nick","目錄編號":"w_cat","調性":"w_key","編制":"w_scoring","樂譜版本":"w_edition","創作年份":"w_year","創作背景":"w_background","題獻/首演":"w_dedication"};
  var sec="";
  txt.split("\n").forEach(function(raw){
    var t=raw.trim();if(!t)return;
    if(t.indexOf("理想版本目標")>=0){sec="goal";return}
    if(t.indexOf("樂章明細")>=0){sec="mov";return}
    var pm=t.match(/^([^:：]+)::\s*(.*)$/);
    if(pm){
      var k=pm[1].trim(),v=pm[2].trim();
      if(!v||k==="type"||k==="記錄日期")return;
      if(k==="作曲家"){out.f.w_compCus=v.replace(/\[\[|\]\]/g,"");return}
      if(k==="時期/樂派"){out.wera=v.split(/,\s*/).filter(Boolean);return}
      if(k==="同類作品"){var m2=v.match(/\[\[作品___([^\]]+)\]\](?:\s*—\s*(.*))?/);
        if(m2){out.f.w_similar=m2[1];if(m2[2])out.f.w_similarnote=m2[2]}else out.f.w_similar=v;return}
      if(k==="資料來源"){var sp=v.split(/\s+—\s+/);out.wsrc.push({d:sp[0]||"",u:sp[1]||""});return}
      if(map[k])out.f[map[k]]=v;
      return;
    }
    if(sec==="goal"){
      var gm=t.match(/^(敘事|速度|音色|風格|結構焦點)[:：]\s*(.*)$/);
      if(gm)out.f[{敘事:"goal_narrative",速度:"goal_tempo",音色:"goal_timbre",風格:"goal_style",結構焦點:"goal_structure"}[gm[1]]]=gm[2];
      return;
    }
    if(sec==="mov"){
      var mm=t.match(/^([IVX]+\.)\s*(.*)$/);
      if(mm)out.movs.push({l:mm[1],txt:mm[2]||""});
    }
  });
  if(out.movs.length===0)out.movs=[{l:"I.",txt:""}];
  return out;
}
function MG_parseMus(txt){
  var out={f:{},S:{},perf:[],notes:[],likes:[],dis:[],chg:[],exp:[],wera:[],mtype:[],mroles:[],minst:[],wsrc:[],msrc:[],movs:[{l:"I.",txt:""}]};
  txt.split("\n").forEach(function(raw){
    var t=raw.trim();if(!t)return;
    var pm=t.match(/^([^:：]+)::\s*(.*)$/);
    if(!pm){
      var ap=t.match(/^📎\s*(.*)$/);
      if(ap){var sp2=ap[1].split(/\s+—\s+/);out.msrc.push({d:sp2[0]||"",u:sp2[1]||""})}
      return;
    }
    var k=pm[1].trim(),v=pm[2].trim();
    if(!v||k==="type"||k==="記錄日期")return;
    if(k==="別名")out.f.m_alias=v;
    else if(k==="類型")out.mtype=v.split(/,\s*/).filter(Boolean);
    else if(k==="樂器")out.minst=v.split(/,\s*/).filter(Boolean);
    else if(k==="Roles")out.mroles=v.split(/,\s*/).filter(Boolean);
    else if(k==="Style-Era")out.f.m_styleera=v;
    else if(k==="活躍年代"){var yy=v.split(/[–—-]\s*/);out.f.m_from=yy[0]||"";out.f.m_to=yy[1]||""}
    else if(k==="一句話")out.f.m_oneline=v;
  });
  return out;
}

var MG_AC={box:null,target:null,idx:-1,items:[],q:""};
function MG_acInit(){
  if(MG_AC.box)return;
  var b=document.createElement("div");b.id="mgac";document.body.appendChild(b);
  MG_AC.box=b;
  window.addEventListener("scroll",MG_acHide,true);
}
function MG_acQuery(q){
  q=q.trim().toLowerCase();
  if(!q)return[];
  var src=MG_local().concat(MG_SEEDS,MG_CLOUD,MG_BUILTIN);
  var seen={},out=[];
  for(var i=0;i<src.length&&out.length<12;i++){
    var v=src[i];if(!v[1])continue;
    var key=v[0]+"|"+v[1];if(seen[key])continue;
    var en=String(v[2]||""),ds=String(v[3]||""),tg=String(typeof v[4]==="string"?v[4]:"");
    if(v[1].toLowerCase().indexOf(q)>=0||en.toLowerCase().indexOf(q)>=0||ds.toLowerCase().indexOf(q)>=0||tg.toLowerCase().indexOf(q)>=0){
      seen[key]=1;out.push({zh:v[1],en:en,cat:v[0],desc:ds});
    }
  }
  return out;
}
function MG_acTrigger(inp){
  var s=inp.selectionStart==null?inp.value.length:inp.selectionStart;
  var before=inp.value.slice(0,s);
  var m=before.match(/(\S+)$/);
  var q=m?m[1]:"";
  if(q.length<1){MG_acHide();return}
  var items=MG_acQuery(q);
  if(items.length===0){MG_acHide();return}
  MG_AC.target=inp;MG_AC.q=q;MG_AC.items=items;MG_AC.idx=0;
  var h="";
  items.forEach(function(it,i){
    h+='<div class="acit'+(i===0?" on":"")+'" data-i="'+i+'"><span><b>'+esc(it.zh)+'</b>'+(it.en?' <span class="en">'+esc(it.en)+'</span>':'')+'</span><span class="ct">'+esc(it.cat)+'</span></div>';
  });
  MG_AC.box.innerHTML=h;
  var its=MG_AC.box.querySelectorAll(".acit");
  for(var i=0;i<its.length;i++){
    its[i].addEventListener("mousedown",function(e){e.preventDefault();MG_AC.idx=+this.getAttribute("data-i");MG_acPick()});
  }
  var r=inp.getBoundingClientRect();
  MG_AC.box.style.left=r.left+"px";
  MG_AC.box.style.top=(r.bottom+2)+"px";
  MG_AC.box.style.width=Math.max(r.width,260)+"px";
  MG_AC.box.style.display="block";
}
function MG_acHide(){if(MG_AC.box)MG_AC.box.style.display="none";MG_AC.target=null;MG_AC.idx=-1}
function MG_acKey(e,inp){
  if(MG_AC.box.style.display!=="block"||MG_AC.target!==inp)return;
  if(e.key==="ArrowDown"){MG_AC.idx=(MG_AC.idx+1)%MG_AC.items.length;MG_acHi();e.preventDefault()}
  else if(e.key==="ArrowUp"){MG_AC.idx=(MG_AC.idx-1+MG_AC.items.length)%MG_AC.items.length;MG_acHi();e.preventDefault()}
  else if(e.key==="Enter"){if(MG_AC.idx>=0){MG_acPick();e.preventDefault()}}
  else if(e.key==="Escape"){MG_acHide()}
}
function MG_acHi(){
  var its=MG_AC.box.querySelectorAll(".acit");
  for(var i=0;i<its.length;i++)its[i].classList.toggle("on",i===MG_AC.idx);
}
function MG_acPick(){
  var it=MG_AC.items[MG_AC.idx];if(!it||!MG_AC.target)return;
  var inp=MG_AC.target;
  var text=it.zh+(it.en?" "+it.en:"");
  var s=inp.selectionStart==null?inp.value.length:inp.selectionStart;
  var e2=inp.selectionEnd==null?s:inp.selectionEnd;
  var before=inp.value.slice(0,s),after=inp.value.slice(e2);
  var m=before.match(/(\S+)$/);
  var rep=m?m[1]:"";
  var nb=before.slice(0,before.length-rep.length);
  var pad=nb&&!/\s$/.test(nb)?" ":"";
  inp.value=nb+pad+text+" "+after.replace(/^\s+/,"");
  var np=(nb+pad+text+" ").length;
  MG_acHide();
  inp.focus();
  try{inp.setSelectionRange(np,np)}catch(x){}
  inp.dispatchEvent(new Event("input"));
}
function MG_acBind(inp){MG_acInit();inp.addEventListener("input",function(){MG_acTrigger(inp)});inp.addEventListener("keydown",function(e){MG_acKey(e,inp)});inp.addEventListener("blur",function(){setTimeout(MG_acHide,180)})}

  else{btn.dataset.orig=btn.textContent;btn.dataset.arm="1";btn.textContent="⚠️ 再撳一次確認清空";

function MG_mkDl(outId,fnId,pre,buildFn){
  var t=MG(outId);if(!t||MG(fnId))return;
  var box=document.createElement("div");
  var inp=document.createElement("input");inp.id=fnId;inp.placeholder="檔名（自動填）";inp.style.marginTop="6px";
  inp.addEventListener("input",function(){inp.dataset.touched="1"});
  var btn=document.createElement("button");btn.textContent="💾 下載 .md";btn.className="gbtn";btn.style.cssText="width:100%;margin-top:6px";
  btn.onclick=function(){
    var r=buildFn();if(!r)return;
    var base=(inp.dataset.touched==="1"&&inp.value.trim())?MG_cleanName(inp.value.trim().replace(/\.md$/i,"")):pre+MG_cleanName(r.name);
    inp.value=base;
    var b=new Blob([r.txt],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=base+".md";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
    MG_toast("已下載 "+base+".md");
  };
  box.appendChild(inp);box.appendChild(btn);t.parentNode.insertBefore(box,t.nextSibling);
}
