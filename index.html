<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Wiki</title>
<!-- Markdown 引擎 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Supabase 客戶端 v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 圖示字型 -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  :root{--bg:#f4f4f5;--card:#fff;--primary:#2563eb;--text:#333;--gray:#888;--red:#dc2626}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:60px}
  a{color:var(--primary);text-decoration:none}
  /* 佈局容器 */
  #app{min-height:100vh}
  .pad{padding:16px}
  .max-w{max-width:800px;margin:0 auto}
  /* 卡片 */
  .card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 5px rgba(0,0,0,0.03);margin-bottom:12px}
  /* 按鈕 */
  .btn{background:var(--primary);color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{opacity:0.9;transform:scale(0.98)}
  .btn-red{background:var(--red)}
  .btn-ghost{background:transparent;color:#333;width:auto;padding:8px}
  /* 輸入框 */
  .inp{width:100%;padding:14px;margin-bottom:12px;border:1px solid #eee;border-radius:10px;background:#fafafa;font-size:16px;box-sizing:border-box}
  .inp:focus{outline:none;border-color:var(--primary);background:#fff}
  textarea.inp{font-family:monospace;line-height:1.5;resize:vertical}
  /* 頂部紅色錯誤條 */
  #err{display:none;background:var(--red);color:#fff;padding:12px;text-align:center;font-weight:bold;position:fixed;top:0;width:100%;z-index:999}
  /* Markdown 樣式 */
  .md h1{font-size:1.8em;border-bottom:1px solid #eee;padding-bottom:10px;margin-top:0}
  .md h2{font-size:1.4em;margin-top:1.5em}
  .md img{max-width:100%;border-radius:8px}
  .md blockquote{border-left:4px solid #ddd;margin:0;padding-left:15px;color:#var(--gray)}
  .md code{background:#eee;padding:2px 5px;border-radius:4px;font-family:monospace}
  .wiki-link{background:#eff6ff;color:var(--primary);padding:2px 6px;border-radius:5px;font-weight:500}
  /* 頂部導航 */
  .nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);position:sticky;top:0;z-index:50;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
  .nav-title{font-weight:800;font-size:18px}
  /* 右下懸浮新增按鈕 */
  .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(37,99,235,0.3);cursor:pointer;z-index:90}
  /* Modal（刪除確認） */
  .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center}
  .modal{background:#fff;width:90%;max-width:320px;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
</style>
</head>
<body>

<div id="err"></div>
<div id="app"></div>

<!-- 刪除確認 Modal -->
<div id="delModal" class="modal-overlay">
  <div class="modal">
    <h3 style="margin-top:0">確定刪除？</h3>
    <p style="color:#666">此動作無法復原。</p>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-red" id="btnDelYes">刪除</button>
      <button class="btn" style="background:#eee;color:#333" id="btnDelNo">取消</button>
    </div>
  </div>
</div>

<script>
/* ================= 設置區（必填） ================= */
var SUPA_URL="https://xlplarozmcjcqgvfsyaj.supabase.co"; // 改你個 Project URL
var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhscGxhcm96bWNqY3FndmZzeWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTk0MzAsImV4cCI6MjEwNDQzNTQzMH0.ObTyjGPjlZbCjrMVQzllCmFIKYaDRnVL-3CXXgY21mQ";                     // 改你個 anon/public key
var OWNER_EMAIL="yantung@mywiki.local";               // 改你喺 Supabase Auth 入面嗰個 Email
/* ================================================ */

/* 初始化 Supabase 客戶端 */
var SDB=supabase.createClient(SUPA_URL,SUPA_KEY);
var ME=null;
var STATE={};

/* 錯誤攔截：頂部紅條顯示 */
window.onerror=function(m){
  var e=document.getElementById("err");
  e.style.display="block";
  e.textContent="⚠️ "+m;
  return false;
};
window.addEventListener("unhandledrejection",function(e){
  window.onerror((e.reason&&e.reason.message)||String(e.reason));
});

/* 快捷取 DOM 元素 */
function el(id){
  var x=document.getElementById(id);
  if(!x){
    console.warn("DOM: missing #"+id+", auto-fixing.");
    x=document.createElement("div");
    x.id=id;
    document.body.appendChild(x);
  }
  return x;
}
function go(hash){location.hash=hash;}

/* === 路由 === */
function route(){
  var h=location.hash||"#/";
  if(!ME && h!=="#/auth"){go("#/auth");return;}
  if(h==="#/auth")viewAuth();
  else if(h==="#/")viewHome();
  else if(h.startsWith("#/page/"))viewPage(h.split("/")[2]);
  else if(h.startsWith("#/edit"))viewEditor(h.split("/")[2]||null);
  else if(h.startsWith("#/search/"))viewSearch(h.split("/")[2]);
  else viewHome();
}
window.onhashchange=route;
(async function init(){
  var s=await SDB.auth.getSession();
  if(s.data.session)ME=s.data.session.user;
  route();
})();

/* === Auth（Phase 1 延續）=== */
function viewAuth(){
  el("app").innerHTML=
  '<div style="height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
    '<div class="card" style="width:100%;text-align:center">'+
      '<h1 style="font-size:40px;margin-bottom:10px">📚</h1>'+
      '<h2 style="margin:10px 0 20px 0">My Wiki</h2>'+
      '<input id="pw" type="password" class="inp" placeholder="輸入密碼">'+
      '<button id="btnLogin" class="btn">解鎖</button>'+
      '<p id="authMsg" style="color:var(--red);height:20px;margin-top:10px"></p>'+
    '</div>'+
  '</div>';
  el("btnLogin").onclick=login;
  el("pw").addEventListener("keydown",function(e){
    if(e.key==="Enter")login();
  });
  setTimeout(function(){el("pw").focus();},100);
}

async function login(){
  var pw=el("pw").value;
  var r=await SDB.auth.signInWithPassword({email:OWNER_EMAIL,password:pw});
  if(r.error){
    el("authMsg").textContent="密碼錯誤";
    return;
  }
  ME=r.data.user;
  route();
}

/* === 首頁（含搜尋）=== */
async function viewHome(){
  el("app").innerHTML='<div class="pad" style="text-align:center;color:#999">載入中...</div>';
  try{
    var q=await SDB.from("pages").select("id,title,updated_at").order("updated_at",{ascending:false});
    var list=q.data||[];

    var html='<div class="nav"><span class="nav-title">所有頁面</span></div>';
    html+='<div class="pad max-w">';
    html+='<input id="search" class="inp" placeholder="🔍 搜尋頁面...">';
    html+='<div id="list"></div></div>';
    html+='<div class="fab" onclick="go(\'#/edit\')"><span class="material-icons-round">add</span></div>';

    el("app").innerHTML=html;

    /* 即時搜尋：只係前端過濾顯示 */
    el("search").addEventListener("input",function(){
      var term=this.value.toLowerCase();
      var items=el("list").children;
      for(var i of items){
        var txt=i.textContent.toLowerCase();
        i.style.display=txt.includes(term)?"block":"none";
      }
    });

    /* 渲染列表 */
    list.forEach(function(p){
      var d=new Date(p.updated_at).toLocaleDateString();
      el("list").innerHTML+=
      '<div class="card" style="display:flex;justify-content:space-between;align-items:center">'+
        '<div style="flex:1"><a href="#/page/'+p.id+'" style="font-size:18px;font-weight:600">'+p.title+'</a><div style="font-size:12px;color:#999;margin-top:4px">編輯於 '+d+'</div></div>'+
      '</div>';
    });
  }catch(e){window.onerror(e.message);}
}

/* === 瀏覽頁面（Phase 2 Markdown + 連結）=== */
async function viewPage(id){
  el("app").innerHTML='<div class="pad">載入中...</div>';
  try{
    var p=await SDB.from("pages").select("*").eq("id",id).single();
    if(p.error)return go("#/");
    STATE.page=p;

    var b=await SDB.from("blocks").select("content").eq("page_id",id).order("order_num");
    var txt=(b.data||[]).map(function(x){return x.content;}).join("\n\n");

    /* 將 [[標題]] 轉成 <a href="#/search/標題"> */
    var linked=txt.replace(/\[\[(.*?)\]\]/g,function(m,t){
      return '<a href="#/search/'+encodeURIComponent(t)+'" class="wiki-link">'+t+'</a>';
    });

    /* Markdown 渲染 */
    var htmlContent=marked.parse(linked);

    /* 頂部導航：下載 + 編輯 */
    var html='<div class="nav">'+
      '<a href="#/" class="btn-ghost"><span class="material-icons-round">arrow_back</span></a> '+
      '<span style="flex:1;text-align:center;font-weight:bold">'+p.title+'</span> '+
      '<span onclick="dlPage('+id+')" style="cursor:pointer;color:#666;margin-right:10px" title="下載 Markdown"><span class="material-icons-round">download</span></span> '+
      '<span onclick="viewEditor('+id+')" style="cursor:pointer;color:var(--primary)" title="編輯"><span class="material-icons-round">edit</span></span>'+
    '</div>';

    html+='<div class="pad max-w">';
    html+='<div class="md">'+htmlContent+'</div>';
    html+='<div style="margin-top:40px;text-align:center;border-top:1px solid #eee;padding-top:20px">';
    html+='<button class="btn btn-red" style="width:auto;background:#fff;color:var(--red);border:1px solid #fee2e2" onclick="confirmDel('+id+')">🗑️ 刪除頁面</button>';
    html+='</div></div>';
    el("app").innerHTML=html;
    document.title=p.title;
  }catch(e){window.onerror(e.message);}
}

/* === 編輯器（新建/修改）=== */
async function viewEditor(id){
  var isEdit=!!id;
  var title="無標題";
  var txt="";
  if(isEdit){
    try{
      var p=await SDB.from("pages").select("title").eq("id",id).single();
      if(p.data)title=p.data.title;
      var b=await SDB.from("blocks").select("content").eq("page_id",id).order("order_num");
      if(b.data)txt=b.data.map(function(x){return x.content;}).join("\n\n");
    }catch(e){}
  }

  var html='<div class="nav"><a href="'+(isEdit?'#/page/'+id:'#/')+'" class="btn-ghost"><span class="material-icons-round">close</span></a> <span class="nav-title">'+(isEdit?'編輯':'新頁面')+'</span> <span onclick="savePage('+id+')" style="color:var(--primary);font-weight:bold;cursor:pointer">儲存</span></div>';
  html+='<div class="pad"><div class="card">';
  html+='<input id="etitle" class="inp" value="'+title.replace(/"/g,"&quot;")+'" placeholder="頁面標題">';
  html+='<textarea id="ebody" class="inp" style="height:60vh" placeholder="Markdown 模式... 用 [[標題]] 建立連結">'+txt.replace(/</g,"&lt;")+'</textarea>';
  html+='<div style="font-size:12px;color:#999;margin-top:10px">支援 # 標題、**粗體**、[[連結]]</div>';
  html+='</div></div>';
  el("app").innerHTML=html;
}

/* === 儲存頁面（新建/更新）=== */
async function savePage(id){
  try{
    var title=el("etitle").value.trim()||"無標題";
    var body=el("ebody").value.trim();
    var pid=id;

    if(!pid){
      var p=await SDB.from("pages").insert({user_id:ME.id,title:title}).select("id").single();
      if(p.error)throw p.error;
      pid=p.data.id;
    }else{
      var u=await SDB.from("pages").update({title:title}).eq("id",pid);
      if(u.error)throw u.error;
    }

    await SDB.from("blocks").delete().eq("page_id",pid);
    if(body){
      var b=await SDB.from("blocks").insert({page_id:pid,content:body,order_num:0});
      if(b.error)throw b.error;
    }
    go("#/page/"+pid);
  }catch(e){alert("保存失敗: "+e.message);}
}

/* === 刪除頁面（Modal）=== */
function confirmDel(id){
  el("delModal").style.display="flex";
  el("btnDelYes").onclick=async function(){
    await SDB.from("blocks").delete().eq("page_id",id);
    await SDB.from("pages").delete().eq("id",id);
    el("delModal").style.display="none";
    go("#/");
  };
  el("btnDelNo").onclick=function(){el("delModal").style.display="none";};
}

/* === 下載 Markdown（方便匯出到 Logseq/Obsidian）=== */
async function dlPage(id){
  try{
    var p=await SDB.from("pages").select("*").eq("id",id).single();
    var b=await SDB.from("blocks").select("content").eq("page_id",id).order("order_num");
    if(!p.data){alert("讀取失敗");return;}

    var title=p.data.title;
    var content=(b.data||[]).map(function(x){return x.content;}).join("\n\n");
    var markdown="title: "+title+"\n\n"+content;

    var blob=new Blob([markdown],{type:"text/markdown"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;
    a.download=title+".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){alert("下載失敗: "+e.message);}
}

/* === 搜尋（前端過濾：跳去首頁並輸入關鍵字）=== */
function viewSearch(term){
  viewHome();
  setTimeout(function(){
    var box=el("search");
    if(box){
      box.value=decodeURIComponent(term);
      box.dispatchEvent(new Event("input"));
    }
  },100);
}
</script>
</body>
</html>
